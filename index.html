<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="neon">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOWES | متجر أحذية ومعدات كرة القدم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- مكتبة Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

    <style>
        :root[data-theme="neon"] { --bg-main: #0b0f13; --bg-card: #141c24; --primary: #00ff88; --text-main: #ffffff; --text-muted: #8b9bb4; --border: rgba(0, 255, 136, 0.15); }
        :root[data-theme="gold"] { --bg-main: #0d0c0a; --bg-card: #1c1814; --primary: #ffcc00; --text-main: #ffffff; --text-muted: #a8a29e; --border: rgba(255, 204, 0, 0.2); }
        :root[data-theme="crimson"] { --bg-main: #0b0912; --bg-card: #161224; --primary: #ff2a5f; --text-main: #ffffff; --text-muted: #9ca3af; --border: rgba(255, 42, 95, 0.2); }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; }
        header { position: sticky; top: 0; z-index: 100; background: var(--bg-main); border-bottom: 1px solid var(--border); padding: 12px 4%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-family: 'Chakra Petch', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        .theme-switcher { display: flex; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 20px; gap: 5px; }
        .theme-dot { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .theme-dot.active { border-color: #fff; }
        .dot-neon { background: #00ff88; } .dot-gold { background: #ffcc00; } .dot-crimson { background: #ff2a5f; }
        .btn { padding: 8px 16px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-main); font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--primary); color: #000; border: none; }
        .cart-badge { background: #000; color: var(--primary); padding: 1px 6px; border-radius: 10px; font-size: 0.8rem; }
        .banner { padding: 25px 4% 15px; text-align: center; }
        .banner h1 { font-size: 1.8rem; margin-bottom: 5px; }
        .banner p { color: var(--text-muted); font-size: 0.95rem; }
        .filters { padding: 10px 4%; display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .filters::-webkit-scrollbar { display: none; }
        .filter-btn { padding: 6px 14px; border-radius: 8px; background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; }
        .filter-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .products-grid { padding: 20px 4%; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .product-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-4px); }
        .card-img { position: relative; height: 170px; background: #000; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .badge-cond { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
        .cond-new { background: #00ff88; color: #000; } .cond-used { background: #ff9900; color: #000; }
        .sold-badge { position: absolute; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; color: #ff2a5f; font-weight: 900; font-size: 1.1rem; transform: rotate(-10deg); }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex: 1; justify-content: space-between; gap: 10px; }
        .title { font-size: 0.95rem; font-weight: 700; }
        .footer-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }
        .price { color: var(--primary); font-weight: 900; font-size: 1.05rem; }
        
        /* Modal & Cart */
        .modal-overlay, .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; display: none; padding: 15px; }
        .modal-overlay { justify-content: center; align-items: center; }
        .cart-overlay { justify-content: flex-end; padding: 0; }
        .modal-overlay.open, .cart-overlay.open { display: flex; }
        .modal-box { background: var(--bg-main); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; overflow-x: hidden; }
        
        /* Image Slider for Multiple Images */
        .image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; margin-bottom: 12px; padding-bottom: 5px; }
        .image-slider::-webkit-scrollbar { height: 6px; }
        .image-slider::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        .slide-img { scroll-snap-align: center; flex: 0 0 100%; height: 260px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); }
        .swipe-hint { text-align: center; font-size: 0.8rem; color: var(--primary); margin-top: -8px; margin-bottom: 15px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .cart-box { width: 100%; max-width: 380px; background: var(--bg-main); height: 100%; padding: 20px; display: flex; flex-direction: column; overflow-y: auto; border-left: 1px solid var(--border); }
        .cart-item { display: flex; gap: 10px; background: var(--bg-card); padding: 8px; border-radius: 10px; margin-bottom: 8px; align-items: center; }
        .cart-item img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-muted); }
        .form-control { width: 100%; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; font-size: 0.9rem; outline: none; }
        .form-control option { background: #111; }
        .toast { position: fixed; bottom: 20px; left: 20px; background: var(--primary); color: #000; padding: 10px 18px; border-radius: 8px; font-weight: 800; font-size: 0.85rem; z-index: 999; display: none; }
        .loader-container { grid-column: 1/-1; display:flex; justify-content:center; align-items:center; padding: 50px; flex-direction:column; gap:15px; color:var(--primary); }
    </style>
</head>
<body>

    <div id="toast" class="toast">تمت العملية بنجاح</div>

    <header>
        <a href="#" class="logo"><i class="fa-solid fa-futbol"></i> SHOWES</a>
        <div class="nav-right">
            <div class="theme-switcher">
                <div class="theme-dot dot-neon active" onclick="setTheme('neon', this)"></div>
                <div class="theme-dot dot-gold" onclick="setTheme('gold', this)"></div>
                <div class="theme-dot dot-crimson" onclick="setTheme('crimson', this)"></div>
            </div>
            <button class="btn btn-primary" onclick="toggleCart(true)">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </header>

    <section class="banner">
        <h1>متجر تجهيزات كرة القدم</h1>
        <p>أحذية أصلية (جديد ومستعمل نظيف) وكفوف حراسة في العراق</p>
    </section>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('all', this)">الكل</button>
        <button class="filter-btn" onclick="filterCat('shoes', this)">أحذية</button>
        <button class="filter-btn" onclick="filterCat('gloves', this)">كفوف</button>
        <button class="filter-btn" onclick="filterCond('all', this)">حالة: الكل</button>
        <button class="filter-btn" onclick="filterCond('جديد', this)">جديد فقط</button>
        <button class="filter-btn" onclick="filterCond('مستعمل', this)">مستعمل فقط</button>
    </div>

    <div class="products-grid" id="productsGrid">
        <div class="loader-container">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
            <p>جاري تحميل البضاعة...</p>
        </div>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <!-- سلة المشتريات -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                <h3>سلة المشتريات</h3>
                <button class="btn" onclick="toggleCart(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="cartItemsList" style="flex:1; overflow-y:auto; margin-bottom:15px;"></div>
            <form id="orderForm" onsubmit="checkout(event)" style="border-top:1px solid var(--border); padding-top:15px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-weight:800; font-size:0.95rem;">
                    <span>المجموع + توصيل (5ألاف):</span>
                    <span id="totalPrice" style="color:var(--primary)">0 د.ع</span>
                </div>
                <div class="form-group"><label>الاسم الثلاثي</label><input type="text" id="cName" class="form-control" required></div>
                <div class="form-group"><label>رقم الهاتف</label><input type="tel" id="cPhone" class="form-control" placeholder="07XXXXXXXXX" required></div>
                <div class="form-group">
                    <label>المحافظة</label>
                    <select id="cGov" class="form-control" required>
                        <option value="">اختر المحافظة...</option>
                        <option value="دهوك">دهوك</option><option value="أربيل">أربيل</option><option value="السليمانية">السليمانية</option>
                        <option value="بغداد">بغداد</option><option value="نينوى">نينوى</option><option value="البصرة">البصرة</option>
                        <option value="كركوك">كركوك</option><option value="أخرى">محافظة أخرى</option>
                    </select>
                </div>
                <div class="form-group"><label>العنوان (المنطقة / نقطة دالة)</label><input type="text" id="cAddress" class="form-control" required></div>
                <button type="submit" class="btn btn-primary" id="checkoutBtn" style="width:100%; justify-content:center; padding:12px; margin-top:5px;">
                    تأكيد الطلب (دفع عند الاستلام)
                </button>
            </form>
        </div>
    </div>

    <script>
        // إعدادات Appwrite الحقيقية
        const { Client, Databases, ID, Query } = Appwrite;
        const client = new Client()
            .setEndpoint('https://cloud.appwrite.io/v1')
            .setProject('6ada4776003bf1e22cbc'); 
            
        const databases = new Databases(client);
        
        const DB_ID = '6ada47920006b021fce1';
        const PROD_COL = '6ada480a0002f071d7e0';
        const ORD_COL = '6ada49e6001d78d32a0e';

        let products = [];
        let cart = [];
        let catFilter = 'all';
        let condFilter = 'all';

        async function fetchProducts() {
            try {
                const response = await databases.listDocuments(DB_ID, PROD_COL, [
                    Query.limit(50),
                    Query.orderDesc('$createdAt')
                ]);
                products = response.documents;
                renderProducts();
            } catch (error) {
                console.error("Error fetching products:", error);
                document.getElementById('productsGrid').innerHTML = `<p style="grid-column:1/-1; text-align:center; color:#ff2a5f;">حدث خطأ في جلب البضاعة. حاول مجدداً.</p>`;
            }
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            const filtered = products.filter(p => {
                const matchCat = catFilter === 'all' || p.category === catFilter;
                const matchCond = condFilter === 'all' || p.condition === condFilter;
                return matchCat && matchCond;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:30px;">لا توجد منتجات مطابقة حالياً</p>`;
                return;
            }

            grid.innerHTML = filtered.map(p => {
                // قد تكون الصورة رابط واحد، أو عدة روابط مفصولة بفاصلة
                const imagesArray = p.image ? p.image.split(',') : [];
                const firstImage = imagesArray[0] || '';

                return `
                <div class="product-card" onclick="openProductModal('${p.$id}')">
                    <div class="card-img">
                        <span class="badge-cond ${p.condition === 'جديد' ? 'cond-new' : 'cond-used'}">${p.condition}</span>
                        ${p.sold ? '<div class="sold-badge">مباع SOLD</div>' : ''}
                        <img src="${firstImage}" alt="${p.name}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="title">${p.name}</div>
                            <div style="font-size:0.8rem; color:var(--text-muted); margin-top:3px;">القياس: ${p.size} | المتوفر: ${p.stock || 1}</div>
                        </div>
                        <div class="footer-row">
                            <div class="price">${Number(p.price).toLocaleString()} د.ع</div>
                            <span style="font-size:0.75rem; color:var(--primary);">التفاصيل <i class="fa-solid fa-arrow-left"></i></span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openProductModal(id) {
            const p = products.find(x => x.$id === id);
            if (!p) return;
            const modal = document.getElementById('productModal');
            const content = document.getElementById('modalContent');

            // تجهيز سلايدر الصور
            const imagesArray = p.image ? p.image.split(',') : [];
            let imagesHtml = imagesArray.map(img => `<img src="${img}" class="slide-img">`).join('');
            let swipeHint = imagesArray.length > 1 ? `<div class="swipe-hint">اسحب لليمين واليسار لمشاهدة باقي الصور (${imagesArray.length}) 👈</div>` : '';

            content.innerHTML = `
                <button class="btn" style="position:absolute; top:15px; left:15px; padding:6px 10px; z-index:10;" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
                
                <div class="image-slider">
                    ${imagesHtml}
                </div>
                ${swipeHint}

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                    <span class="badge-cond ${p.condition === 'جديد' ? 'cond-new' : 'cond-used'}" style="position:static;">${p.condition}</span>
                    <span style="font-weight:900; color:var(--primary); font-size:1.3rem;">${Number(p.price).toLocaleString()} د.ع</span>
                </div>
                <h2 style="font-size:1.2rem; margin-bottom:5px;">${p.name}</h2>
                <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:10px;">
                    القياس: <strong style="color:#fff;">${p.size}</strong> | العدد المتوفر: <strong style="color:#fff;">${p.stock || 1}</strong> قطع
                </div>
                <p style="font-size:0.9rem; color:var(--text-muted); line-height:1.6; margin-bottom:20px; background:rgba(255,255,255,0.03); padding:10px; border-radius:8px;">
                    ${p.desc || 'لا يوجد وصف إضافي لهذا المنتج.'}
                </p>
                ${p.sold ? '<button class="btn" disabled style="width:100%; justify-content:center; opacity:0.5;">المنتج غير متوفر (مباع)</button>' : 
                `<button class="btn btn-primary" style="width:100%; justify-content:center; padding:12px;" onclick="addAndClose('${p.$id}')">
                    <i class="fa-solid fa-cart-plus"></i> إضافة إلى السلة
                </button>`}
            `;
            modal.classList.add('open');
        }

        function closeModal() { document.getElementById('productModal').classList.remove('open'); }
        function addAndClose(id) { addToCart(id); closeModal(); }

        function filterCat(cat, btn) {
            catFilter = cat;
            document.querySelectorAll('.filters .filter-btn').forEach(b => {
                if(b.textContent.includes('الكل') || b.textContent.includes('أحذية') || b.textContent.includes('كفوف')) b.classList.remove('active');
            });
            btn.classList.add('active');
            renderProducts();
        }

        function filterCond(cond, btn) {
            condFilter = cond;
            document.querySelectorAll('.filters .filter-btn').forEach(b => {
                if(b.textContent.includes('حالة') || b.textContent.includes('جديد فقط') || b.textContent.includes('مستعمل فقط')) b.classList.remove('active');
            });
            btn.classList.add('active');
            renderProducts();
        }

        function setTheme(name, dot) {
            document.documentElement.setAttribute('data-theme', name);
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
            dot.classList.add('active');
        }

        function addToCart(id) {
            const prod = products.find(p => p.$id === id);
            if (!prod || prod.sold) return;
            if (cart.find(item => item.$id === id)) {
                showToast('المنتج موجود في السلة');
                toggleCart(true);
                return;
            }
            cart.push(prod);
            updateCart();
            showToast('تمت الإضافة للسلة 🛒');
        }

        function removeFromCart(id) {
            cart = cart.filter(i => i.$id !== id);
            updateCart();
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.length;
            const list = document.getElementById('cartItemsList');
            const sub = cart.reduce((s, i) => s + Number(i.price), 0);
            const total = cart.length > 0 ? sub + 5000 : 0;
            document.getElementById('totalPrice').innerText = total.toLocaleString() + ' د.ع';

            if (cart.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:20px; font-size:0.85rem;">السلة فارغة</p>`;
                return;
            }

            list.innerHTML = cart.map(i => {
                const firstImage = i.image ? i.image.split(',')[0] : '';
                return `
                <div class="cart-item">
                    <img src="${firstImage}">
                    <div style="flex:1;">
                        <div style="font-size:0.85rem; font-weight:700;">${i.name}</div>
                        <div style="font-size:0.8rem; color:var(--primary);">${Number(i.price).toLocaleString()} د.ع</div>
                    </div>
                    <button class="btn" style="color:#ff2a5f; padding:4px 8px;" onclick="removeFromCart('${i.$id}')"><i class="fa-solid fa-trash"></i></button>
                </div>
                `;
            }).join('');
        }

        function toggleCart(open) { document.getElementById('cartOverlay').classList.toggle('open', open); }

        async function checkout(e) {
            e.preventDefault();
            if (cart.length === 0) return;
            
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري إرسال الطلب...';

            const formattedItems = JSON.stringify(cart.map(i => ({
                name: i.name,
                size: i.size,
                price: i.price,
                // نرسل الصورة الأولى فقط في الطلب لتخفيف حجم البيانات
                image: i.image ? i.image.split(',')[0] : ''
            })));
            
            const totalAmount = cart.reduce((s,i) => s + Number(i.price), 0) + 5000;

            const orderData = {
                customerName: document.getElementById('cName').value,
                phone: document.getElementById('cPhone').value,
                governorate: document.getElementById('cGov').value,
                address: document.getElementById('cAddress').value,
                items: formattedItems,
                total: totalAmount,
                date: new Date().toLocaleString('ar-IQ')
            };

            try {
                await databases.createDocument(DB_ID, ORD_COL, ID.unique(), orderData);
                
                cart = [];
                e.target.reset();
                updateCart();
                toggleCart(false);
                showToast('🎉 تم إرسال طلبك بنجاح! سنتصل بك قريباً.');
            } catch (error) {
                console.error("Checkout Error:", error);
                alert('حدث خطأ أثناء إرسال الطلب. تأكد من اتصالك بالإنترنت وحاول مجدداً.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'تأكيد الطلب (دفع عند الاستلام)';
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        fetchProducts();
    </script>
</body>
</html>
